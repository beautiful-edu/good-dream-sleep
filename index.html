/* Layout: 하늘빛 상단 띠 + 진행 막대 → 가운데 카드 한 장에 한 화면(시작 · 안내 · 문항 · 동의) */
/* Color: 밤하늘 남색 바탕, APSQ=라벤더 인디고, ISI=청록, 동의·완료=달빛 골드 */
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --ink:#1C2140; --muted:#5D6485; --line:#E0E3EF;
  --c1:#4E50A6; --c1-soft:#ECEBF8; --c2:#2C7A84; --c2-soft:#E1F1F2;
  --moon:#D4AE52; --moon-soft:#FAF2DD; --on:#FFFFFF;
  --sky1:#E6E6F7; --sky2:#E3F1F2; --star:#B4BADB; --warn:#B4475A; --warn-soft:#F8E4E8;
  --acc:var(--c1); --acc-soft:var(--c1-soft);
  --f-display:"Paperlogy","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Paperlogy","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Paperlogy","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1225; --surface:#161B33; --ink:#E5E8F4; --muted:#9AA1C2; --line:#283050;
  --c1:#ABAFF3; --c1-soft:#252950; --c2:#7FCBD3; --c2-soft:#16343A;
  --moon:#E8CF8A; --moon-soft:#2E2B1C; --on:#0E1225;
  --sky1:#1B1E42; --sky2:#10283A; --star:#4C5584; --warn:#F09AAA; --warn-soft:#3A2030; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1225; --surface:#161B33; --ink:#E5E8F4; --muted:#9AA1C2; --line:#283050;
  --c1:#ABAFF3; --c1-soft:#252950; --c2:#7FCBD3; --c2-soft:#16343A;
  --moon:#E8CF8A; --moon-soft:#2E2B1C; --on:#0E1225;
  --sky1:#1B1E42; --sky2:#10283A; --star:#4C5584; --warn:#F09AAA; --warn-soft:#3A2030; color-scheme:dark}
.s-apsq{--acc:var(--c1);--acc-soft:var(--c1-soft)}
.s-isi{--acc:var(--c2);--acc-soft:var(--c2-soft)}
.s-moon{--acc:var(--c2);--acc-soft:var(--moon-soft)}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0;min-height:100vh;word-break:keep-all;overflow-wrap:break-word;display:flex;flex-direction:column}
[hidden]{display:none!important}
.wrap{width:100%;max-width:680px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* top band */
.sky{background:
  radial-gradient(1.5px 1.5px at 12% 30%,var(--star) 50%,transparent 51%),
  radial-gradient(1px 1px at 28% 70%,var(--star) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 46% 22%,var(--star) 50%,transparent 51%),
  radial-gradient(1px 1px at 63% 58%,var(--star) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 78% 34%,var(--star) 50%,transparent 51%),
  radial-gradient(1px 1px at 90% 76%,var(--star) 50%,transparent 51%),
  linear-gradient(120deg,var(--sky1),var(--sky2));
  border-bottom:1px solid var(--line)}
.band{display:flex;align-items:center;gap:12px;padding-block:14px}
.band svg{width:30px;height:30px;flex:none}
.band .brand{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.band .t{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.3}
.track{height:4px;display:flex;background:var(--line)}
.track i{display:block;height:100%;width:0;transition:width .35s ease}
#track-a{background:var(--c1)}#track-n{background:var(--c2)}

/* stage */
main{flex:1;display:flex;align-items:flex-start;padding-block:32px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px 28px 24px;box-shadow:0 10px 30px -18px color-mix(in srgb,var(--ink) 30%,transparent)}
@media (max-width:560px){.card{padding:24px 18px 18px}main{padding-block:20px 16px}}
.screen{animation:in .28s ease both}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}

.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tag{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--acc)}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-weight:500;font-size:15px}
.dots{display:flex;gap:4px;margin-bottom:22px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--acc-soft)}
.dots i.on{background:var(--acc)}
.dots i.now{background:color-mix(in srgb,var(--acc) 45%,var(--acc-soft))}
.period{display:inline-block;font-size:12.5px;background:var(--acc-soft);border-radius:999px;padding:3px 12px;margin-bottom:14px}
.question{font-family:var(--f-display);font-size:clamp(21px,3.4vw,26px);line-height:1.5;font-weight:700;margin:0 0 28px;min-height:3em;text-wrap:pretty}

.scale{display:grid;gap:8px}
.scale.s10{grid-template-columns:repeat(10,minmax(0,1fr))}
.scale.s5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:560px){.scale.s10{grid-template-columns:repeat(5,minmax(0,1fr))}}
.opt{height:52px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s,transform .1s}
.opt:hover{border-color:var(--acc)}
.opt:active{transform:scale(.96)}
.opt[aria-checked="true"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.anchors{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);margin-top:10px}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 18px;cursor:pointer;font-size:15px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:default}
.hint{font-size:13.5px;color:var(--warn);min-height:1.5em;margin-top:12px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}

/* start / intro */
.lead h1{font-size:clamp(26px,4.4vw,34px);line-height:1.3;margin:6px 0 10px}
.lead p{color:var(--muted);margin:0 0 6px}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
@media (max-width:480px){.parts{grid-template-columns:1fr}}
.part{border-radius:12px;padding:14px 16px;background:var(--acc-soft)}
.part .tag{display:block;margin-bottom:2px}
.part b{font-family:var(--f-display);font-size:16px}
.part small{display:block;color:var(--muted);font-size:12.5px}
.fields{display:flex;flex-wrap:wrap;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 180px}
.field label{font-size:12.5px;color:var(--muted);letter-spacing:.03em}
.field em{font-style:normal;color:var(--warn)}
.field input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field input.mono{font-family:var(--f-mono);letter-spacing:.25em}
.field input.missing{border-color:var(--warn);background:var(--warn-soft)}
.intro-box{background:var(--acc-soft);border-radius:12px;padding:18px 20px;margin:18px 0 6px}
.intro-box p{margin:0}
.intro-box strong{color:var(--acc)}
.sub{font-size:15px;color:var(--muted);margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted)}

/* consent */
.consent{background:var(--moon-soft);border:1px solid color-mix(in srgb,var(--moon) 45%,var(--line));border-radius:12px;padding:18px;margin-top:16px}
.consent dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0 0 12px;font-size:14px}
.consent dt{color:var(--muted)}
.consent dd{margin:0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--c2);flex:none}
.consent.missing{border-color:var(--warn);background:var(--warn-soft)}
.allset{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.allset span{font-size:13px;border-radius:999px;padding:3px 12px}
.allset .a{background:var(--c1-soft)}.allset .n{background:var(--c2-soft)}
.msg{font-size:13.5px;color:var(--warn);min-height:1.5em;margin-top:12px}

.done{text-align:center;display:grid;justify-items:center;gap:12px;padding-block:24px}
.done svg{width:64px;height:64px}
.done h2{font-size:26px}
.done p{color:var(--muted);max-width:40ch;margin:0}
.logo{display:block;line-height:0}
.logo img{height:auto;max-width:100%}
.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:inline}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:inline}
.logo.start{margin-bottom:22px}
.logo.done{margin-top:18px;opacity:.9}
.host{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13.5px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.host span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.hostline{font-weight:500;color:var(--ink);margin-bottom:2px}
.footer{font-size:12px;color:var(--muted);padding-block:8px 28px;padding-inline:20px;text-align:center}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
@media (hover:none){.kbd{display:none}}
</style>
</head>

      <div class="tag" style="color:var(--c2)">2026 하반기 한국도로교통공단 GOOD DREAM 교육</div>
      <h1>APSQ·ISI 수면 검사</h1>
      <p>두 개의 설문에 차례로 응답합니다. 한 화면에 한 문항씩 나오며, 전체 17문항으로 약 5분이 걸립니다.</p>
      <div class="host"><span>주최</span>한국도로교통공단 · (주)알음다움</div>
      <div class="parts">
        <div class="part s-apsq"><span class="tag">PART 1 · APSQ</span><b>APSQ 검사</b><small>수면에 대한 염려 · 10문항 · 지난 한 달간</small></div>
        <div class="part s-isi"><span class="tag">PART 2 · ISI</span><b>ISI 검사</b><small>수면 상태 · 7문항 · 최근 2주간</small></div>
      </div>
      <div class="fields">
        <div class="field"><label for="who">이름 <em>*</em></label><input id="who" type="text" maxlength="30" placeholder="홍길동" autocomplete="name" value="${esc(st.who)}"></div>
        <div class="field" style="flex-basis:150px"><label for="phone4">휴대전화 뒷자리 4자리 <em>*</em></label><input id="phone4" class="mono" type="text" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off" value="${esc(st.phone4)}"></div>
        <div class="field" style="flex-basis:160px"><label for="date">검사일</label><input id="date" type="date" value="${esc(st.date)}"></div>
      </div>
      <p style="font-size:12.5px;margin-top:10px">이름과 휴대전화 뒷자리는 동명이인을 구분하는 데만 사용합니다.</p>
      <div class="msg" id="msg"></div>
      <div class="nav" style="justify-content:flex-end"><button class="btn primary" id="next">검사 시작</button></div>
    </div>`;
    $("who").oninput=e=>{st.who=e.target.value; e.target.classList.remove("missing"); save();};
    $("phone4").oninput=e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,4); st.phone4=e.target.value; e.target.classList.remove("missing"); save();};
    $("date").onchange=e=>{st.date=e.target.value; save();};
    $("next").onclick=()=>{
      const okN=st.who.trim().length>0, okP=/^\d{4}$/.test(st.phone4);
      $("who").classList.toggle("missing",!okN); $("phone4").classList.toggle("missing",!okP);
      if(!okN||!okP){ $("msg").textContent=!okN?"이름을 적어 주십시오.":"휴대전화 번호 뒷자리 4자리를 숫자로 적어 주십시오."; (!okN?$("who"):$("phone4")).focus(); return; }
      go(st.step+1);
    };
  }

  function renderIntro(s){
    const isA=s==="apsq";
    card.innerHTML=`<div class="screen">
      <div class="eyebrow"><span class="tag">${SCALES[s].part}</span><span class="count">${isA?"10":"7"}문항</span></div>
      <h2 style="font-size:clamp(23px,3.8vw,28px)">${isA?"APSQ 검사":"ISI 검사"}</h2>
      <div class="sub">${isA?"수면에 대한 염려":"수면 상태"}</div>
      <div class="intro-box"><p>${isA
        ?"다음 문항 중 <strong>지난 한 달간</strong> 각 항목의 느낌을 어느 정도로 경험했는지 해당되는 곳에 표시해 주십시오."
        :"<strong>최근 2주간</strong>의 수면 상태를 떠올리며 각 문항에 가장 가까운 정도를 선택해 주십시오."}</p></div>
      <div class="facts"><span class="chip">${isA?"1점 전혀 그렇지 않다 ~ 10점 매우 그렇다":"0점 전혀 그렇지 않다 ~ 4점 매우 그렇다"}</span><span class="chip">숫자를 누르면 다음 문항으로 넘어갑니다</span></div>
      <div class="nav"><button class="btn ghost" id="prev">이전</button><button class="btn primary" id="next">${isA?"APSQ 시작":"ISI 시작"}</button></div>
    </div>`;
    $("prev").onclick=()=>go(st.step-1);
    $("next").onclick=()=>go(st.step+1);
    $("next").focus({preventScroll:true});
  }

  function renderItem(s,i){
    const sc=SCALES[s], n=sc.items.length, val=st[s][i];
    let opts="";
    for(let v=sc.min; v<=sc.max; v++) opts+=`<button class="opt" role="radio" aria-checked="${val===v}" data-v="${v}" aria-label="${v}점">${v}</button>`;
    const dots=sc.items.map((_,k)=>`<i class="${k===i?"now":(st[s][k]!==null?"on":"")}"></i>`).join("");
    card.innerHTML=`<div class="screen">
      <div class="eyebrow"><span class="tag">${sc.part}</span><span class="count">문항 <b>${String(i+1).padStart(2,"0")}</b> / ${n}</span></div>
      <div class="dots" aria-hidden="true">${dots}</div>
      <span class="period">${sc.period}</span>
      <p class="question" id="qtext">${sc.items[i]}</p>
      <div class="scale ${n===10?"s10":"s5"}" role="radiogroup" aria-labelledby="qtext">${opts}</div>
      <div class="anchors"><span>${sc.min} 전혀 그렇지 않다</span><span>${sc.max} 매우 그렇다</span></div>
      <div class="hint" id="hint" aria-live="polite"></div>
      <div class="nav"><button class="btn ghost" id="prev">이전</button><button class="btn primary" id="next" aria-disabled="${val===null}">다음</button></div>
    </div>
    <div class="kbd">키보드 숫자로도 응답할 수 있습니다${n===10?" (10점은 0 키)":""}</div>`;
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(s,i,Number(b.dataset.v)));
    $("prev").onclick=()=>go(st.step-1);
    $("next").onclick=()=>{ if(st[s][i]!==null) go(st.step+1); else needAnswer(); };
  }

  function pick(s,i,v){
    st[s][i]=v; save(); progress();
    card.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-checked",Number(b.dataset.v)===v));
    $("next").setAttribute("aria-disabled","false"); $("hint").textContent="";
    const dot=card.querySelectorAll(".dots i")[i]; if(dot) dot.className="on";
    clearTimeout(advanceTimer);
    advanceTimer=setTimeout(()=>go(st.step+1),380);
  }

    const aN=st.apsq.filter(v=>v!==null).length, nN=st.isi.filter(v=>v!==null).length;
    card.innerHTML=`<div class="screen">

        <p style="font-size:13px;color:var(--muted);margin:0 0 12px">동의하지 않을 권리가 있으며, 동의하지 않으면 응답을 제출할 수 없습니다.</p>

    $("consent").onchange=e=>{st.consent=e.target.checked; $("consent-box").classList.remove("missing"); save();};
    $("prev").onclick=()=>go(st.step-1);
    $("submit").onclick=submit;

  async function submit(){
    if(sending) return;
    const msg=$("msg"); msg.textContent="";
    if(!(st.who.trim() && /^\d{4}$/.test(st.phone4))){ go(0); return; }
    for(const s of ["apsq","isi"]){
      const i=st[s].indexOf(null);
      if(i>-1){ go(STEPS.findIndex(x=>x.t==="item"&&x.s===s&&x.i===i)); return; }
    }
    if(!st.consent){ $("consent-box").classList.add("missing"); msg.textContent="개인정보 수집 및 이용에 동의해야 제출할 수 있습니다."; return; }
    if(!/^https:\/\/script\.google\.com\//.test(SCRIPT_URL)){ msg.textContent="제출 주소가 아직 설정되지 않았습니다. 검사 담당자에게 알려 주십시오."; return; }
    sending=true; const btn=$("submit"); btn.disabled=true; btn.textContent="제출 중…";
    const payload=JSON.stringify({who:st.who.trim(), phone4:st.phone4, date:st.date, consent:true, apsq:st.apsq, isi:st.isi});
    let ok=false;
    try{
      const r=await fetch(SCRIPT_URL,{method:"POST",body:payload});
      const j=await r.json(); ok=!!j.ok;
    }catch(err){
      if(err instanceof TypeError){
        try{ await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:payload}); ok=true; }catch(e2){ ok=false; }
      }
    }
    sending=false;
    if(ok){
      try{localStorage.removeItem(KEY);}catch(e){}
      $("track-a").style.width="0"; $("track-n").style.width="0";
      card.className="card s-moon";

  // 키보드: 숫자키 응답, ←/→ 이동
  document.addEventListener("keydown",e=>{
    const step=STEPS[st.step];
    if(step.t!=="item"||e.target.tagName==="INPUT"||e.metaKey||e.ctrlKey||e.altKey) return;
    const sc=SCALES[step.s];
    if(/^[0-9]$/.test(e.key)){
      let v=Number(e.key); if(step.s==="apsq"&&v===0) v=10;
      if(v>=sc.min&&v<=sc.max){ e.preventDefault(); pick(step.s,step.i,v); }
    }else if(e.key==="ArrowLeft"){ go(st.step-1); }
    else if(e.key==="ArrowRight"){ if(st[step.s][step.i]!==null) go(st.step+1); else needAnswer(); }
  });

  function needAnswer(){
    const el=$("hint"); if(!el) return;
    el.textContent="이 문항에 응답해야 다음으로 넘어갈 수 있습니다.";
    const sc=card.querySelector(".scale"); sc.classList.remove("shake"); void sc.offsetWidth; sc.classList.add("shake");
  }
  // 저장된 위치가 응답하지 않은 문항보다 뒤에 있으면 그 문항으로 되돌림
  (function guard(){
    if(st.step>0 && !(st.who.trim() && /^\d{4}$/.test(st.phone4))){ st.step=0; return; }
    for(let k=1;k<st.step;k++){ const x=STEPS[k]; if(x.t==="item"&&st[x.s][x.i]===null){ st.step=k; return; } }
  })();
  render();
})();
